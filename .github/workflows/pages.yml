name: Publish Rift Heroes Codex

on:
  push:
    branches: [main]
    paths:
      - 'site-bundle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and unpack the site
        run: |
          cat site-bundle/part-* > site.tar.gz
          sha256sum --check site-bundle/sha256.txt
          mkdir _site
          tar --extract --gzip --file site.tar.gz --directory _site --no-same-owner
          test -s _site/index.html
          test -s _site/races.html
          test -s _site/heroes.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
